name: proxy-box

services:
  proxy-box:
    image: ghcr.io/xjester0/proxy-box:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      # required
      DOMAIN: example.com
      ACME_EMAIL: admin@example.com
      USER: admin
      PASSWORD: changeme
      # naive
      NAIVE_ENABLED: "1"
      # mieru
      MIERU_ENABLED: "1"
      MIERU_PORT_RANGE: 40000-40010
      # telegram desktop WEB (tproxy-server + official MTProxy)
      TELEGRAM_ENABLED: "1"
      TPROXY_SECRET: "" # empty - auto generate, 32 hex
      TELEGRAM_STATS_PORT: "8888"
      MTPROXY_WORKERS: "1"
      MTPROXY_MAX_CONNECTIONS: "4096"
      # vless
      VLESS_ENABLED: "1"
      VLESS_PORT: "59684"
      VLESS_DEST: www.cloudflare.com
      VLESS_FP: edge
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - ./data:/data
